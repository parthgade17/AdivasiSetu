# Render Blueprint: New > Blueprint > pick this repo. Creates a Postgres database and the web service.
databases:
  - name: adivasisetu-db
    plan: free

services:
  - type: web
    name: adivasisetu
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: adivasisetu-db, property: connectionString }
      - key: ADMIN_PHONES
        sync: false        # your admin mobile number(s), comma separated
      - key: SMS_PROVIDER
        value: console     # change to msg91 or twilio, then fill the keys below
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
    # Free web services have no persistent disk: uploaded documents are lost on redeploy.
    # Use plan "starter" and uncomment to keep them:
    # disk: { name: uploads, mountPath: /data/uploads, sizeGB: 1 }
