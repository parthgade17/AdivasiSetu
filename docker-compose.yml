# One command:  docker compose up --build   ->  http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adivasisetu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      POSTGRES_DB: adivasisetu
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adivasisetu"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://adivasisetu:${POSTGRES_PASSWORD:-change-this-password}@db:5432/adivasisetu
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]

volumes:
  pgdata:
  uploads:
